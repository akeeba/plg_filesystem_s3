PLG_FILESYSTEM_S3_CONFIG_ACL_DESC="Détermine l'ACL prédéfinie utilisée pour les objets nouvellement téléversés, copiés, renommés et pour les nouveaux marqueurs de dossier. En cas de doute, conservez Lecture publique."
