PLG_FILESYSTEM_S3_CONFIG_CDN_URL_DESC="L'URL de base de la distribution CloudFront ou du CDN tiers pour le bucket et le répertoire spécifiés. Ce plugin utilisera le protocole <code>http://</code> ou <code>https://</code> que vous indiquez ici. Lorsque vous utilisez Amazon CloudFront, ce champ prend en charge à la fois l'URL de distribution CloudFront fournie par Amazon et tous les CNAME que vous avez définis. Lorsque vous utilisez un fournisseur tiers, veuillez consulter sa documentation."

