PLG_FILESYSTEM_S3_CONFIG_USEHTTPDATEHEADER_LABEL="Utiliser l'en-tête HTTP Date au lieu de l'en-tête X-Amz-Date"
PLG_FILESYSTEM_S3_CONFIG_USEHTTPDATEHEADER_DESC="Laissez Non pour Amazon S3. Certains services tiers compatibles S3, tels que DreamObjects, en ont besoin pour fonctionner."

PLG_FILESYSTEM_S3_CONFIG_CACHING_LABEL="Mise en cache des requêtes"
PLG_FILESYSTEM_S3_CONFIG_CACHING_DESC="Mettre en cache les requêtes de liste de répertoires vers l'API Amazon S3 pour accélérer l'affichage du Gestionnaire de médias. Cependant, les modifications effectuées en dehors du Gestionnaire de médias de ce site ne seront pas reflétées avant l'expiration du cache."

PLG_FILESYSTEM_S3_CACHE_TIME_LABEL="Durée de mise en cache des requêtes"
PLG_FILESYSTEM_S3_CACHE_TIME_DESC="La durée maximale de mise en cache des requêtes vers l'API Amazon S3. Les valeurs recommandées se situent entre 30 et 300 secondes. Des durées plus courtes peuvent être inefficaces ; des durées plus longues peuvent faire en sorte que des modifications effectuées en dehors du Gestionnaire de médias de ce site n'apparaissent pas avant très longtemps, ce qui peut prêter à confusion. Par défaut : 300 secondes (5 minutes). NE RÉGLEZ PAS CETTE VALEUR AU-DESSUS DE LA PLUS FAIBLE VALIDITÉ D'URL SIGNÉE QUE VOUS AVEZ UTILISÉE DANS VOS CONNEXIONS. EN CAS DE DOUTE, LAISSEZ LA VALEUR TELLE QUELLE."

[Configuration.Advanced]
PLG_FILESYSTEM_S3_CONFIG_PREVIEW_LABEL="Aperçu des images"
PLG_FILESYSTEM_S3_CONFIG_PREVIEW_DESC="Quand faut-il afficher des aperçus d'images ? <strong>ATTENTION ! CELA PEUT COÛTER CHER !</strong> L'activation des aperçus sur des buckets S3 sans distribution CloudFront peut entraîner une forte hausse des coûts, car toutes les images d'un dossier doivent être chargées depuis Amazon S3 chaque fois que vous affichez ce dossier dans le Gestionnaire de médias."
PLG_FILESYSTEM_S3_CONFIG_PREVIEW_NEVER="Désactivé"
PLG_FILESYSTEM_S3_CONFIG_PREVIEW_CLOUDFRONT="CDN uniquement"
PLG_FILESYSTEM_S3_CONFIG_PREVIEW_ALWAYS="Toujours"

PLG_FILESYSTEM_S3_CONFIG_PREVIEWEXTENSIONS_LABEL="Extensions d'aperçu"
PLG_FILESYSTEM_S3_CONFIG_PREVIEWEXTENSIONS_DESC="Une liste d'extensions de fichiers séparées par des virgules, sans point initial, qui seront prévisualisées dans le Gestionnaire de médias pour les connexions S3/CloudFront, par ex. <code>png,gif,jpg,jpeg,bmp,webp,pdf,svg</code>. Laissez vide pour utiliser la liste par défaut du Gestionnaire de médias."

PLG_FILESYSTEM_S3_CONFIG_LAMBDARESIZE_LABEL="Utiliser le redimensionnement Lambda@Edge"
PLG_FILESYSTEM_S3_CONFIG_LAMBDARESIZE_DESC="Dois-je redimensionner dynamiquement les images hébergées sur CloudFront à l'aide de Lambda@Edge pour les aperçus ? Veuillez lire la documentation ; ceci est réservé aux utilisateurs <strong>experts</strong>."

PLG_FILESYSTEM_S3_CONFIG_CACHE_THUMBNAILS_LABEL="Mettre les miniatures en cache"
PLG_FILESYSTEM_S3_CONFIG_CACHE_THUMBNAILS_DESC="Dois-je créer des miniatures localement et les mettre en cache dans le répertoire <code>media/plg_filesystem_s3/cache</code> ? <strong>Attention !</strong> Cela augmentera la charge du serveur lors des premières visites d'un dossier contenant de grandes ou de nombreuses images."

PLG_FILESYSTEM_S3_CONFIG_MAX_THUMBNAIL_TIME_LABEL="Temps maximal de création des miniatures (secondes)"
PLG_FILESYSTEM_S3_CONFIG_MAX_THUMBNAIL_TIME_DESC="Le temps maximal, en secondes, consacré à la création des miniatures, mesuré approximativement depuis le début du chargement de la page. Valeurs recommandées : 5 à 15 secondes. Plage acceptée : 1 à 120 secondes."

PLG_FILESYSTEM_S3_CONFIG_RESIZEDIMENSION_LABEL="Dimension de redimensionnement (px)"
PLG_FILESYSTEM_S3_CONFIG_RESIZEDIMENSION_DESC="La dimension en pixels demandée à Lambda@Edge pour redimensionner les images d'aperçu. La valeur par défaut est 100, ce qui produit des aperçus de 100x100 pixels, parfaitement adaptés au Gestionnaire de médias de Joomla sur des écrans 96 ppp. Si vous utilisez des écrans HiDPI, vous pouvez augmenter cette valeur."

