PLG_FILESYSTEM_S3_CONFIG_ACL_WARNING_LABEL="Avertissement"
PLG_FILESYSTEM_S3_CONFIG_ACL_WARNING_TEXT="Si vous choisissez une ACL autre que Lecture publique, vous DEVEZ fournir une URL de CDN via un type de connexion compatible CDN. Sans URL de CDN, le Gestionnaire de médias générera des URL directes du bucket, qui ne fonctionneront pas pour les objets non publics."

