PLG_FILESYSTEM_S3_CONFIG_CDN_URL_LABEL="URL CDN"
PLG_FILESYSTEM_S3_CONFIG_CDN_URL_DESC="Το βασικό URL της διανομής CloudFront ή του CDN τρίτου παρόχου για το καθορισμένο bucket και κατάλογο. Αυτό το πρόσθετο θα χρησιμοποιήσει το πρωτόκολλο <code>http://</code> ή <code>https://</code> που ορίζετε εδώ. Όταν χρησιμοποιείτε Amazon CloudFront αυτό το πεδίο υποστηρίζει τόσο το URL διανομής CloudFront που παρέχει η Amazon όσο και τυχόν CNAME που έχετε ορίσει. Για τρίτους παρόχους συμβουλευτείτε την τεκμηρίωσή τους."

PLG_FILESYSTEM_S3_CONFIG_ACL_LABEL="ACL μεταφορτωμένων αντικειμένων"
PLG_FILESYSTEM_S3_CONFIG_ACL_DESC="Καθορίζει την έτοιμη ACL που χρησιμοποιείται για νέα μεταφορτωμένα, αντιγραμμένα, μετονομασμένα και νεοδημιουργημένα αντικείμενα δείκτη φακέλου. Αν δεν είστε βέβαιοι, κρατήστε το Δημόσια ανάγνωση."
PLG_FILESYSTEM_S3_CONFIG_ACL_PUBLIC_READ="Δημόσια ανάγνωση (συνιστάται)"
PLG_FILESYSTEM_S3_CONFIG_ACL_PRIVATE="Ιδιωτικό"
