PLG_FILESYSTEM_S3_CONFIG_ACL_BUCKET_OWNER_FULL_CONTROL="Πλήρης έλεγχος από τον ιδιοκτήτη του bucket"
PLG_FILESYSTEM_S3_CONFIG_ACL_WARNING_LABEL="Προειδοποίηση"
PLG_FILESYSTEM_S3_CONFIG_ACL_WARNING_TEXT="Αν επιλέξετε ACL διαφορετική από Δημόσια ανάγνωση, ΠΡΕΠΕΙ να δώσετε URL CDN μέσω τύπου σύνδεσης με υποστήριξη CDN. Χωρίς URL CDN ο Διαχειριστής Πολυμέσων θα δημιουργεί απευθείας URL bucket, τα οποία δεν θα λειτουργούν για μη δημόσια αντικείμενα."

