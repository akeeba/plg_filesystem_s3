PLG_FILESYSTEM_S3_CONFIG_USEHTTPDATEHEADER_LABEL="Χρήση κεφαλίδας HTTP Date αντί για κεφαλίδα X-Amz-Date"
PLG_FILESYSTEM_S3_CONFIG_USEHTTPDATEHEADER_DESC="Αφήστε το στο Όχι για το Amazon S3. Ορισμένες υπηρεσίες τρίτων συμβατές με S3, όπως το DreamObjects, το χρειάζονται για να λειτουργήσουν."

PLG_FILESYSTEM_S3_CONFIG_CACHING_LABEL="Cache αιτημάτων"
PLG_FILESYSTEM_S3_CONFIG_CACHING_DESC="Αποθηκεύει προσωρινά τα αιτήματα λίστας καταλόγων προς το API του Amazon S3 για να επιταχύνει την εμφάνιση στον Διαχειριστή Πολυμέσων. Ωστόσο, αλλαγές που γίνονται εκτός του Διαχειριστή Πολυμέσων αυτού του ιστότοπου δεν θα εμφανιστούν μέχρι να λήξει η cache."

PLG_FILESYSTEM_S3_CACHE_TIME_LABEL="Χρόνος cache αιτημάτων"
PLG_FILESYSTEM_S3_CACHE_TIME_DESC="Ο μέγιστος χρόνος προσωρινής αποθήκευσης αιτημάτων προς το API του Amazon S3. Οι συνιστώμενες τιμές είναι μεταξύ 30 και 300 δευτερολέπτων. Μικρότεροι χρόνοι cache μπορεί να είναι αναποτελεσματικοί, ενώ μεγαλύτεροι μπορεί να έχουν ως αποτέλεσμα αλλαγές που έγιναν εκτός του Διαχειριστή Πολυμέσων αυτού του ιστότοπου να μην εμφανίζονται για πολύ μεγάλο διάστημα, δημιουργώντας σύγχυση. Προεπιλογή: 300 δευτερόλεπτα (5 λεπτά). ΜΗΝ ΟΡΙΖΕΤΕ ΑΥΤΗΝ ΤΗΝ ΤΙΜΗ ΥΨΗΛΟΤΕΡΑ ΑΠΟ ΤΗ ΜΙΚΡΟΤΕΡΗ ΔΙΑΡΚΕΙΑ ΙΣΧΥΟΣ ΥΠΟΓΕΓΡΑΜΜΕΝΩΝ URL ΠΟΥ ΕΧΕΤΕ ΧΡΗΣΙΜΟΠΟΙΗΣΕΙ ΣΤΙΣ ΣΥΝΔΕΣΕΙΣ ΣΑΣ. ΑΝ ΔΕΝ ΕΙΣΤΕ ΒΕΒΑΙΟΙ, ΑΦΗΣΤΕ ΤΗΝ ΩΣ ΕΧΕΙ."

[Configuration.Advanced]
PLG_FILESYSTEM_S3_CONFIG_PREVIEW_LABEL="Προεπισκόπηση εικόνας"
PLG_FILESYSTEM_S3_CONFIG_PREVIEW_DESC="Πότε να εμφανίζονται προεπισκοπήσεις εικόνων; <strong>ΠΡΟΕΙΔΟΠΟΙΗΣΗ! ΑΥΤΟ ΜΠΟΡΕΙ ΝΑ ΕΙΝΑΙ ΔΑΠΑΝΗΡΟ!</strong> Η ενεργοποίηση προεπισκοπήσεων σε bucket S3 χωρίς διανομή CloudFront μπορεί να αυξήσει σημαντικά το κόστος, επειδή όλες οι εικόνες ενός φακέλου πρέπει να φορτώνονται από το Amazon S3 κάθε φορά που προβάλλετε αυτόν τον φάκελο στον Διαχειριστή Πολυμέσων."
PLG_FILESYSTEM_S3_CONFIG_PREVIEW_NEVER="Απενεργοποιημένο"
PLG_FILESYSTEM_S3_CONFIG_PREVIEW_CLOUDFRONT="Μόνο CDN"
PLG_FILESYSTEM_S3_CONFIG_PREVIEW_ALWAYS="Πάντα"

PLG_FILESYSTEM_S3_CONFIG_PREVIEWEXTENSIONS_LABEL="Επεκτάσεις προεπισκόπησης"
PLG_FILESYSTEM_S3_CONFIG_PREVIEWEXTENSIONS_DESC="Μια λίστα επεκτάσεων αρχείων χωρισμένη με κόμματα, χωρίς τελεία στην αρχή, που θα προεπισκοπούνται στον Διαχειριστή Πολυμέσων για συνδέσεις S3/CloudFront, π.χ. <code>png,gif,jpg,jpeg,bmp,webp,pdf,svg</code>. Αφήστε κενό για να χρησιμοποιηθεί η προεπιλεγμένη λίστα του Διαχειριστή Πολυμέσων."

PLG_FILESYSTEM_S3_CONFIG_LAMBDARESIZE_LABEL="Χρήση αλλαγής μεγέθους Lambda@Edge"
PLG_FILESYSTEM_S3_CONFIG_LAMBDARESIZE_DESC="Να γίνεται δυναμική αλλαγή μεγέθους εικόνων που φιλοξενούνται στο CloudFront με Lambda@Edge για προεπισκόπηση; Διαβάστε την τεκμηρίωση, αυτό προορίζεται <strong>μόνο</strong> για προχωρημένους χρήστες."

PLG_FILESYSTEM_S3_CONFIG_CACHE_THUMBNAILS_LABEL="Cache μικρογραφιών"
PLG_FILESYSTEM_S3_CONFIG_CACHE_THUMBNAILS_DESC="Να δημιουργούνται μικρογραφίες τοπικά και να αποθηκεύονται στην cache στον κατάλογο <code>media/plg_filesystem_s3/cache</code>; <strong>Προειδοποίηση!</strong> Αυτό θα αυξήσει το φορτίο του διακομιστή τις πρώτες φορές που επισκέπτεστε φάκελο με πολλές ή μεγάλες εικόνες."

PLG_FILESYSTEM_S3_CONFIG_MAX_THUMBNAIL_TIME_LABEL="Μέγιστος χρόνος δημιουργίας μικρογραφιών (δευτερόλεπτα)"
PLG_FILESYSTEM_S3_CONFIG_MAX_THUMBNAIL_TIME_DESC="Ο μέγιστος χρόνος σε δευτερόλεπτα που θα δαπανηθεί για τη δημιουργία μικρογραφιών, μετρώντας περίπου από την αρχή φόρτωσης της σελίδας. Συνιστώμενες τιμές: 5 έως 15 δευτερόλεπτα. Αποδεκτό εύρος: 1 έως 120 δευτερόλεπτα."

PLG_FILESYSTEM_S3_CONFIG_RESIZEDIMENSION_LABEL="Διάσταση αλλαγής μεγέθους (px)"
PLG_FILESYSTEM_S3_CONFIG_RESIZEDIMENSION_DESC="Η διάσταση σε pixel που θα ζητηθεί από το Lambda@Edge για την αλλαγή μεγέθους των εικόνων προεπισκόπησης. Η προεπιλογή είναι 100, που δίνει εικόνες προεπισκόπησης 100x100 pixel, κάτι απολύτως επαρκές για τον Διαχειριστή Πολυμέσων του Joomla σε οθόνες 96ppi. Αν χρησιμοποιείτε οθόνες HiDPI, ίσως θέλετε να το αυξήσετε."

