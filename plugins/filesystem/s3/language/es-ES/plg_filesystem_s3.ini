PLG_FILESYSTEM_S3_CONFIG_USEHTTPDATEHEADER_LABEL="Usar cabecera HTTP Date en lugar de la cabecera X-Amz-Date"
PLG_FILESYSTEM_S3_CONFIG_USEHTTPDATEHEADER_DESC="Déjelo en No para Amazon S3. Algunos servicios de terceros compatibles con S3, como DreamObjects, necesitan esto para funcionar."

PLG_FILESYSTEM_S3_CONFIG_CACHING_LABEL="Caché de solicitudes"
PLG_FILESYSTEM_S3_CONFIG_CACHING_DESC="Almacena en caché las solicitudes de listado de directorios a la API de Amazon S3 para acelerar la visualización del Gestor Multimedia. Sin embargo, los cambios realizados fuera del Gestor Multimedia de este sitio no se reflejarán hasta que caduque la caché."

PLG_FILESYSTEM_S3_CACHE_TIME_LABEL="Tiempo de caché de solicitudes"
PLG_FILESYSTEM_S3_CACHE_TIME_DESC="El tiempo máximo para almacenar en caché las solicitudes a la API de Amazon S3. Los valores recomendados están entre 30 y 300 segundos. Los tiempos de caché más cortos pueden ser ineficaces; los más largos pueden hacer que los cambios realizados fuera del Gestor Multimedia de este sitio no aparezcan durante mucho tiempo, lo que puede causar confusión. Predeterminado: 300 segundos (5 minutos). NO CONFIGURE ESTE VALOR POR ENCIMA DE LA MENOR VALIDEZ DE URL FIRMADAS QUE HAYA USADO EN SUS CONEXIONES. SI NO ESTÁ SEGURO, DÉJELO COMO ESTÁ."

[Configuration.Advanced]
PLG_FILESYSTEM_S3_CONFIG_PREVIEW_LABEL="Vista previa de imagen"
PLG_FILESYSTEM_S3_CONFIG_PREVIEW_DESC="¿Cuándo debo mostrar vistas previas de imágenes? <strong>¡ADVERTENCIA! ¡ESTO PUEDE SER COSTOSO!</strong> Activar vistas previas en buckets S3 sin una distribución de CloudFront puede aumentar mucho los costes, ya que todas las imágenes de una carpeta deben cargarse desde Amazon S3 cada vez que visualiza esa carpeta en el Gestor Multimedia."
PLG_FILESYSTEM_S3_CONFIG_PREVIEW_NEVER="Desactivado"
PLG_FILESYSTEM_S3_CONFIG_PREVIEW_CLOUDFRONT="Solo CDN"
PLG_FILESYSTEM_S3_CONFIG_PREVIEW_ALWAYS="Siempre"

PLG_FILESYSTEM_S3_CONFIG_PREVIEWEXTENSIONS_LABEL="Extensiones de vista previa"
PLG_FILESYSTEM_S3_CONFIG_PREVIEWEXTENSIONS_DESC="Una lista de extensiones de archivo separadas por comas, sin puntos iniciales, que se mostrarán en el Gestor Multimedia para conexiones S3/CloudFront, por ejemplo <code>png,gif,jpg,jpeg,bmp,webp,pdf,svg</code>. Déjelo en blanco para usar la lista predeterminada del Gestor Multimedia."

PLG_FILESYSTEM_S3_CONFIG_LAMBDARESIZE_LABEL="Usar cambio de tamaño con Lambda@Edge"
PLG_FILESYSTEM_S3_CONFIG_LAMBDARESIZE_DESC="¿Debo redimensionar dinámicamente con Lambda@Edge las imágenes alojadas en CloudFront para previsualizarlas? Lea la documentación; esto es <strong>solo</strong> para usuarios expertos."

PLG_FILESYSTEM_S3_CONFIG_CACHE_THUMBNAILS_LABEL="Almacenar miniaturas en caché"
PLG_FILESYSTEM_S3_CONFIG_CACHE_THUMBNAILS_DESC="¿Debo crear miniaturas localmente y almacenarlas en el directorio <code>media/plg_filesystem_s3/cache</code>? <strong>¡Advertencia!</strong> Esto aumentará la carga del servidor las primeras veces que visite una carpeta con imágenes grandes o numerosas."

PLG_FILESYSTEM_S3_CONFIG_MAX_THUMBNAIL_TIME_LABEL="Tiempo máximo de creación de miniaturas (segundos)"
PLG_FILESYSTEM_S3_CONFIG_MAX_THUMBNAIL_TIME_DESC="El tiempo máximo en segundos que se dedicará a crear miniaturas, medido aproximadamente desde el inicio de la carga de la página. Valores recomendados: 5 a 15 segundos. Rango aceptado: 1 a 120 segundos."

PLG_FILESYSTEM_S3_CONFIG_RESIZEDIMENSION_LABEL="Dimensión de cambio de tamaño (px)"
PLG_FILESYSTEM_S3_CONFIG_RESIZEDIMENSION_DESC="La dimensión en píxeles que Lambda@Edge debe usar para redimensionar las imágenes de vista previa. El valor predeterminado es 100, lo que produce imágenes de vista previa de 100x100 píxeles, perfectamente válidas para el Gestor Multimedia de Joomla en monitores de 96 ppp. Si va a usar monitores HiDPI, es posible que desee aumentar este valor."

