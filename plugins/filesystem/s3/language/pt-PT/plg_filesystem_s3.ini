PLG_FILESYSTEM_S3_CONFIG_USEHTTPDATEHEADER_LABEL="Usar o cabeçalho HTTP Date em vez do cabeçalho X-Amz-Date"
PLG_FILESYSTEM_S3_CONFIG_USEHTTPDATEHEADER_DESC="Deixe em Não para Amazon S3. Alguns serviços de terceiros compatíveis com S3, como DreamObjects, precisam disto para funcionar."

PLG_FILESYSTEM_S3_CONFIG_CACHING_LABEL="Cache de pedidos"
PLG_FILESYSTEM_S3_CONFIG_CACHING_DESC="Coloca em cache os pedidos de listagem de diretórios à API Amazon S3 para acelerar a apresentação no Gestor de Multimédia. No entanto, quaisquer alterações feitas fora do Gestor de Multimédia deste site não serão refletidas até a cache expirar."

PLG_FILESYSTEM_S3_CACHE_TIME_LABEL="Tempo de cache dos pedidos"
PLG_FILESYSTEM_S3_CACHE_TIME_DESC="O tempo máximo para colocar em cache pedidos à API Amazon S3. Os valores recomendados situam-se entre 30 e 300 segundos. Tempos de cache mais curtos podem ser ineficazes; tempos mais longos podem fazer com que alterações feitas fora do Gestor de Multimédia deste site não apareçam durante muito tempo, causando confusão. Predefinição: 300 segundos (5 minutos). NÃO DEFINA ESTE VALOR ACIMA DA MENOR VALIDADE DE URL ASSINADO QUE TENHA USADO NAS SUAS LIGAÇÕES. EM CASO DE DÚVIDA, DEIXE COMO ESTÁ."

[Configuration.Advanced]
PLG_FILESYSTEM_S3_CONFIG_PREVIEW_LABEL="Pré-visualização de imagem"
PLG_FILESYSTEM_S3_CONFIG_PREVIEW_DESC="Quando devo apresentar pré-visualizações de imagens? <strong>AVISO! ISTO PODE SER DISPENDIOSO!</strong> Ativar pré-visualizações em buckets S3 sem uma distribuição CloudFront pode aumentar muito os custos, uma vez que todas as imagens de uma pasta têm de ser carregadas a partir do Amazon S3 sempre que visualiza essa pasta no Gestor de Multimédia."
PLG_FILESYSTEM_S3_CONFIG_PREVIEW_NEVER="Desativado"
PLG_FILESYSTEM_S3_CONFIG_PREVIEW_CLOUDFRONT="Apenas CDN"
PLG_FILESYSTEM_S3_CONFIG_PREVIEW_ALWAYS="Sempre"

PLG_FILESYSTEM_S3_CONFIG_PREVIEWEXTENSIONS_LABEL="Extensões de pré-visualização"
PLG_FILESYSTEM_S3_CONFIG_PREVIEWEXTENSIONS_DESC="Uma lista separada por vírgulas de extensões de ficheiro, sem pontos iniciais, que serão pré-visualizadas no Gestor de Multimédia para ligações S3/CloudFront, por exemplo <code>png,gif,jpg,jpeg,bmp,webp,pdf,svg</code>. Deixe em branco para usar a lista predefinida do Gestor de Multimédia."

PLG_FILESYSTEM_S3_CONFIG_LAMBDARESIZE_LABEL="Usar redimensionamento Lambda@Edge"
PLG_FILESYSTEM_S3_CONFIG_LAMBDARESIZE_DESC="Devo redimensionar dinamicamente imagens alojadas no CloudFront com Lambda@Edge para as pré-visualizações? Leia a documentação; isto destina-se <strong>apenas</strong> a utilizadores experientes."

PLG_FILESYSTEM_S3_CONFIG_CACHE_THUMBNAILS_LABEL="Colocar miniaturas em cache"
PLG_FILESYSTEM_S3_CONFIG_CACHE_THUMBNAILS_DESC="Devo criar miniaturas localmente e colocá-las em cache na diretoria <code>media/plg_filesystem_s3/cache</code>? <strong>Aviso!</strong> Isto aumentará a carga do servidor nas primeiras vezes que visitar uma pasta com imagens grandes ou numerosas."

PLG_FILESYSTEM_S3_CONFIG_MAX_THUMBNAIL_TIME_LABEL="Tempo máximo para criar miniaturas (segundos)"
PLG_FILESYSTEM_S3_CONFIG_MAX_THUMBNAIL_TIME_DESC="O tempo máximo em segundos que será gasto a criar miniaturas, medido aproximadamente desde o início do carregamento da página. Valores recomendados: 5 a 15 segundos. Intervalo aceite: 1 a 120 segundos."

PLG_FILESYSTEM_S3_CONFIG_RESIZEDIMENSION_LABEL="Dimensão de redimensionamento (px)"
PLG_FILESYSTEM_S3_CONFIG_RESIZEDIMENSION_DESC="A dimensão em píxeis a pedir ao Lambda@Edge para redimensionar imagens de pré-visualização. O valor predefinido é 100, resultando em imagens de pré-visualização com 100x100 píxeis, perfeitamente adequadas ao Gestor de Multimédia do Joomla em monitores de 96 ppi. Se vai usar monitores HiDPI, pode querer aumentar este valor."

