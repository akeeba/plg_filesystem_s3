PLG_FILESYSTEM_S3_CONFIG_USEHTTPDATEHEADER_LABEL="HTTP-Date-Header statt X-Amz-Date-Header verwenden"
PLG_FILESYSTEM_S3_CONFIG_USEHTTPDATEHEADER_DESC="Lassen Sie dies für Amazon S3 auf Nein. Einige S3-kompatible Dienste von Drittanbietern, wie DreamObjects, benötigen dies zwingend."

PLG_FILESYSTEM_S3_CONFIG_CACHING_LABEL="Anfrage-Caching"
PLG_FILESYSTEM_S3_CONFIG_CACHING_DESC="Zwischenspeichern der Verzeichnislisten-Anfragen an die Amazon-S3-API, um die Anzeige im Medienmanager zu beschleunigen. Änderungen, die außerhalb des Medienmanagers dieser Website vorgenommen werden, werden jedoch erst nach Ablauf des Caches sichtbar."

PLG_FILESYSTEM_S3_CACHE_TIME_LABEL="Cache-Dauer für Anfragen"
PLG_FILESYSTEM_S3_CACHE_TIME_DESC="Die maximale Dauer für das Zwischenspeichern von Anfragen an die Amazon-S3-API. Empfohlene Werte liegen zwischen 30 und 300 Sekunden. Kürzere Cache-Zeiten können wirkungslos sein, längere Cache-Zeiten können dazu führen, dass Änderungen außerhalb des Medienmanagers dieser Website sehr lange nicht sichtbar werden, was zu Verwirrung führen kann. Standard: 300 Sekunden (5 Minuten). STELLEN SIE DIESEN WERT NICHT HÖHER EIN ALS DIE NIEDRIGSTE GÜLTIGKEIT SIGNIERTER URLS, DIE SIE IN IHREN VERBINDUNGEN VERWENDET HABEN. WENN SIE UNSICHER SIND, BELASSEN SIE IHN UNVERÄNDERT."

[Configuration.Advanced]
PLG_FILESYSTEM_S3_CONFIG_PREVIEW_LABEL="Bildvorschau"
PLG_FILESYSTEM_S3_CONFIG_PREVIEW_DESC="Wann sollen Bildvorschauen angezeigt werden? <strong>WARNUNG! DIES KANN TEUER WERDEN!</strong> Wenn Sie Vorschauen für S3-Buckets ohne CloudFront-Distribution aktivieren, können die Kosten erheblich steigen, da bei jedem Aufruf eines Ordners im Medienmanager alle Bilder dieses Ordners von Amazon S3 geladen werden müssen."
PLG_FILESYSTEM_S3_CONFIG_PREVIEW_NEVER="Deaktiviert"
PLG_FILESYSTEM_S3_CONFIG_PREVIEW_CLOUDFRONT="Nur CDN"
PLG_FILESYSTEM_S3_CONFIG_PREVIEW_ALWAYS="Immer"

PLG_FILESYSTEM_S3_CONFIG_PREVIEWEXTENSIONS_LABEL="Vorschau-Erweiterungen"
PLG_FILESYSTEM_S3_CONFIG_PREVIEWEXTENSIONS_DESC="Eine kommagetrennte Liste von Dateierweiterungen ohne führenden Punkt, die im Medienmanager für S3-/CloudFront-Verbindungen als Vorschau angezeigt werden, z. B. <code>png,gif,jpg,jpeg,bmp,webp,pdf,svg</code>. Lassen Sie das Feld leer, um die Standardliste des Medienmanagers zu verwenden."

PLG_FILESYSTEM_S3_CONFIG_LAMBDARESIZE_LABEL="Lambda@Edge-Größenänderung verwenden"
PLG_FILESYSTEM_S3_CONFIG_LAMBDARESIZE_DESC="Sollen auf CloudFront gehostete Bilder für die Vorschau dynamisch mit Lambda@Edge skaliert werden? Bitte lesen Sie die Dokumentation; dies ist <strong>nur</strong> für erfahrene Benutzer."

PLG_FILESYSTEM_S3_CONFIG_CACHE_THUMBNAILS_LABEL="Miniaturansichten zwischenspeichern"
PLG_FILESYSTEM_S3_CONFIG_CACHE_THUMBNAILS_DESC="Sollen Miniaturansichten lokal erstellt und im Verzeichnis <code>media/plg_filesystem_s3/cache</code> zwischengespeichert werden? <strong>Warnung!</strong> Dies erhöht die Serverlast bei den ersten Besuchen eines Ordners mit großen oder zahlreichen Bildern."

PLG_FILESYSTEM_S3_CONFIG_MAX_THUMBNAIL_TIME_LABEL="Maximale Zeit zum Erstellen von Miniaturansichten (Sekunden)"
PLG_FILESYSTEM_S3_CONFIG_MAX_THUMBNAIL_TIME_DESC="Die maximale Zeit in Sekunden, die für das Erstellen von Miniaturansichten aufgewendet wird, gemessen ungefähr ab Beginn des Seitenaufbaus. Empfohlene Werte: 5 bis 15 Sekunden. Zulässiger Bereich: 1 bis 120 Sekunden."

PLG_FILESYSTEM_S3_CONFIG_RESIZEDIMENSION_LABEL="Größe für Skalierung (px)"
PLG_FILESYSTEM_S3_CONFIG_RESIZEDIMENSION_DESC="Die Pixelgröße, die Lambda@Edge für die Skalierung von Vorschaubildern verwenden soll. Standard ist 100, was zu 100x100 Pixel großen Vorschaubildern führt und für den Joomla-Medienmanager auf 96-ppi-Monitoren völlig ausreichend ist. Wenn Sie HiDPI-Monitore verwenden, sollten Sie diesen Wert möglicherweise erhöhen."

