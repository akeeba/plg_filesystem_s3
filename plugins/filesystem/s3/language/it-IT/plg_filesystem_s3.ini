PLG_FILESYSTEM_S3_CONFIG_USEHTTPDATEHEADER_LABEL="Usa l'header HTTP Date invece dell'header X-Amz-Date"
PLG_FILESYSTEM_S3_CONFIG_USEHTTPDATEHEADER_DESC="Lascia No per Amazon S3. Alcuni servizi di terze parti compatibili con S3, come DreamObjects, ne hanno bisogno per funzionare."

PLG_FILESYSTEM_S3_CONFIG_CACHING_LABEL="Cache delle richieste"
PLG_FILESYSTEM_S3_CONFIG_CACHING_DESC="Memorizza nella cache le richieste di elenco directory all'API di Amazon S3 per velocizzare la visualizzazione nel Gestore Media. Tuttavia, le modifiche effettuate al di fuori del Gestore Media di questo sito non saranno visibili fino alla scadenza della cache."

PLG_FILESYSTEM_S3_CACHE_TIME_LABEL="Tempo di cache delle richieste"
PLG_FILESYSTEM_S3_CACHE_TIME_DESC="Il tempo massimo per memorizzare nella cache le richieste all'API di Amazon S3. I valori consigliati sono compresi tra 30 e 300 secondi. Tempi di cache più brevi potrebbero essere inefficaci, tempi più lunghi potrebbero far sì che le modifiche effettuate al di fuori del Gestore Media di questo sito non appaiano per molto tempo, creando confusione. Predefinito: 300 secondi (5 minuti). NON IMPOSTARE QUESTO VALORE AL DI SOPRA DELLA PIÙ BASSA VALIDITÀ DEGLI URL FIRMATI USATA NELLE TUE CONNESSIONI. IN CASO DI DUBBIO, LASCIALO INVARIATO."

[Configuration.Advanced]
PLG_FILESYSTEM_S3_CONFIG_PREVIEW_LABEL="Anteprima immagine"
PLG_FILESYSTEM_S3_CONFIG_PREVIEW_DESC="Quando devo mostrare le anteprime delle immagini? <strong>ATTENZIONE! QUESTO PUÒ ESSERE COSTOSO!</strong> Abilitare le anteprime sui bucket S3 senza una distribuzione CloudFront può comportare costi molto più elevati, poiché tutte le immagini di una cartella devono essere caricate da Amazon S3 ogni volta che visualizzi quella cartella nel Gestore Media."
PLG_FILESYSTEM_S3_CONFIG_PREVIEW_NEVER="Disabilitato"
PLG_FILESYSTEM_S3_CONFIG_PREVIEW_CLOUDFRONT="Solo CDN"
PLG_FILESYSTEM_S3_CONFIG_PREVIEW_ALWAYS="Sempre"

PLG_FILESYSTEM_S3_CONFIG_PREVIEWEXTENSIONS_LABEL="Estensioni per l'anteprima"
PLG_FILESYSTEM_S3_CONFIG_PREVIEWEXTENSIONS_DESC="Un elenco separato da virgole di estensioni file, senza punto iniziale, che verranno mostrate in anteprima nel Gestore Media per le connessioni S3/CloudFront, ad es. <code>png,gif,jpg,jpeg,bmp,webp,pdf,svg</code>. Lascia vuoto per usare l'elenco predefinito del Gestore Media."

PLG_FILESYSTEM_S3_CONFIG_LAMBDARESIZE_LABEL="Usa il ridimensionamento Lambda@Edge"
PLG_FILESYSTEM_S3_CONFIG_LAMBDARESIZE_DESC="Devo ridimensionare dinamicamente con Lambda@Edge le immagini ospitate su CloudFront per mostrarne l'anteprima? Leggi la documentazione; questa funzione è riservata <strong>solo</strong> agli utenti esperti."

PLG_FILESYSTEM_S3_CONFIG_CACHE_THUMBNAILS_LABEL="Memorizza le miniature nella cache"
PLG_FILESYSTEM_S3_CONFIG_CACHE_THUMBNAILS_DESC="Devo creare le miniature localmente e memorizzarle nella directory <code>media/plg_filesystem_s3/cache</code>? <strong>Avvertenza!</strong> Questo aumenterà il carico del server le prime volte che visiti una cartella con immagini grandi o numerose."

PLG_FILESYSTEM_S3_CONFIG_MAX_THUMBNAIL_TIME_LABEL="Tempo massimo per creare miniature (secondi)"
PLG_FILESYSTEM_S3_CONFIG_MAX_THUMBNAIL_TIME_DESC="Il tempo massimo in secondi da dedicare alla creazione delle miniature, misurato approssimativamente dall'inizio del caricamento della pagina. Valori consigliati: da 5 a 15 secondi. Intervallo accettato: da 1 a 120 secondi."

PLG_FILESYSTEM_S3_CONFIG_RESIZEDIMENSION_LABEL="Dimensione di ridimensionamento (px)"
PLG_FILESYSTEM_S3_CONFIG_RESIZEDIMENSION_DESC="La dimensione in pixel da richiedere a Lambda@Edge per ridimensionare le immagini di anteprima. Il valore predefinito è 100, che produce immagini di anteprima di 100x100 pixel, perfettamente adatte al Gestore Media di Joomla su monitor da 96 ppi. Se utilizzi monitor HiDPI, potresti voler aumentare questo valore."

