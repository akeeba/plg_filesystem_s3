# Dockerized throwaway stack for the plg_filesystem_s3 end-to-end tests.
#
# All versions are configurable through the .env file (see env.dist):
#   JOOMLA_VERSION, PHP_VERSION, APACHE_VERSION, MYSQL_VERSION, GARAGE_VERSION.
#
# Do not run this by hand. Use ./run.sh, which scrubs, provisions and tests in
# one shot. This file only describes the services.
#
# The php and web images are the ones shared by every Akeeba E2E stack. They are built by
# ../buildfiles/docker/e2e/images.sh — which run.sh calls before bringing the stack up — never by
# this file, hence `pull_policy: never` and no `build:`. Everything specific to plg_filesystem_s3 is
# bind-mounted into them: php.ini. The web image's default vhost is used as it is.
#
# Every service, the volume and the network carry the org.akeeba.e2e label, which is what the
# scheduled ../buildfiles/docker/e2e/maintain.sh prunes by.
#
# There is deliberately no mail sink: the plugin sends no mail, and run.sh
# switches Joomla's mailer off so nothing else tries to.

name: s3filesystem-e2e

x-e2e-labels: &e2e-labels
  org.akeeba.e2e: "1"

services:
  db:
    image: "mysql:${MYSQL_VERSION:-8.4}"
    labels: *e2e-labels
    environment:
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root}"
      MYSQL_DATABASE: "${DB_NAME:-s3fse2e}"
      MYSQL_USER: "${DB_USER:-s3fse2e}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-s3fse2e}"
    command:
      - "--sql-mode="
    ports:
      # Published so the host-side PHPUnit process can seed and inspect fixtures.
      - "127.0.0.1:${DB_PORT:-33319}:3306"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${DB_ROOT_PASSWORD:-root}"]
      interval: 5s
      timeout: 5s
      retries: 40

  php:
    image: "akeeba-e2e/php:${PHP_VERSION:-8.5}"
    pull_policy: never
    labels: *e2e-labels
    volumes:
      - ./www:/var/www/html
      - ./config/php.ini:/usr/local/etc/php/conf.d/zz-e2e.ini:ro
    depends_on:
      db:
        condition: service_healthy
      garage:
        condition: service_healthy
      s3:
        condition: service_started

  web:
    image: "akeeba-e2e/web:${APACHE_VERSION:-2.4}"
    pull_policy: never
    labels: *e2e-labels
    ports:
      - "127.0.0.1:${HTTP_PORT:-8190}:80"
    volumes:
      - ./www:/var/www/html
    depends_on:
      - php

  # The S3-compatible server every connection under test points at: Garage (MinIO
  # no longer publishes images). A real server, not a stub: request signing (v4;
  # Garage does not implement v2), listing, copy, delete and the object headers
  # the plugin sets are all exercised against it. run.sh provisions it (layout,
  # key, bucket) with garage_provision() from
  # ../buildfiles/docker/e2e/garage/provision.sh.
  #
  # Garage has no published port: the site and the host reach it through the `s3`
  # service below, and the tests write to it with the `s3cli` tool service.
  garage:
    image: "dxflrs/garage:${GARAGE_VERSION:-v2.5.0}"
    labels: *e2e-labels
    volumes:
      - ${E2E_GARAGE_DIR:-../../../../buildfiles/docker/e2e/garage}/garage.toml:/etc/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The S3 endpoint as the SITE sees it: http://s3:9000. An nginx front for Garage
  # (config: ../buildfiles/docker/e2e/garage/public-read.nginx.conf). Garage can
  # neither answer anonymous requests on its S3 port nor apply bucket policies,
  # so this serves anonymous GET/HEAD of /<bucket>/<key> from the bucket's web
  # endpoint (only for buckets run.sh made public with garage_public_read) and
  # sends everything else, every signed request included, to the S3 API.
  # Published to the host, which is how the tests prove an object is publicly
  # readable and that anonymous writes are refused.
  s3:
    image: "nginx:1.27-alpine"
    labels: *e2e-labels
    volumes:
      - ${E2E_GARAGE_DIR:-../../../../buildfiles/docker/e2e/garage}/public-read.nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:${S3_PORT:-9190}:9000"
    depends_on:
      garage:
        condition: service_healthy

  # One-shot AWS CLI, with full credentials. Never started by `up`; the tests
  # invoke it with `docker compose run --rm s3cli …` for everything the anonymous,
  # read-only host view cannot do: listing the bucket, seeding fixtures and
  # writing objects behind the plugin's back.
  s3cli:
    image: "amazon/aws-cli:2.39.0"
    profiles: ["tools"]
    labels: *e2e-labels
    entrypoint: ["aws"]
    environment:
      AWS_ACCESS_KEY_ID: "${S3_ACCESS_KEY:-GK53f5e2e053f5e2e053f5e2e0}"
      AWS_SECRET_ACCESS_KEY: "${S3_SECRET_KEY:-53f5e2e053f5e2e053f5e2e053f5e2e053f5e2e053f5e2e053f5e2e053f5e2e0}"
      AWS_DEFAULT_REGION: "us-east-1"
      AWS_ENDPOINT_URL: "http://garage:3900"
      AWS_REQUEST_CHECKSUM_CALCULATION: "when_required"
      AWS_RESPONSE_CHECKSUM_VALIDATION: "when_required"
    volumes:
      - ./seed:/seed:ro
      - ./bulk:/bulk:ro
    depends_on:
      - garage

networks:
  default:
    labels: *e2e-labels

volumes:
  dbdata:
    labels: *e2e-labels
